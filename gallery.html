<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Zenova Peak Tech Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 1100px; margin: auto; padding: 40px 20px;">
        <header style="text-align: center; margin-bottom: 40px;">
            <h1>Our Workspace & Projects Gallery</h1>
            <p>Explore snapshots of Zenova Peak Tech Hub and Altra AI development environments.</p>
            <a href="index.html" style="color: #2dd4bf; text-decoration: none;">&larr; Back to Home</a>
        </header>

        <!-- Gallery Grid with Optimized Image Sizes -->
        <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <div class="gallery-item">
                <img src="https://via.placeholder.com/600x400/1e293b/2dd4bf?text=Tech+Hub+Workspace" alt="Workspace">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/600x400/1e293b/2dd4bf?text=Altra+AI+Dashboard" alt="Altra AI Dashboard">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/600x400/1e293b/2dd4bf?text=Client+Consultation" alt="Consultation">
            </div>
        </div>
    </div>
</body>
</html>
