<!-- Services Grid Component -->
<div class="services-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
    <div class="service-card" onclick="toggleServicePrice(this)" style="background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 8px; cursor: pointer; border: 1px solid #0d9488;">
        <h3>Altra AI Automation</h3>
        <p>Complete multi-tenant customer care and invoice processing.</p>
        <!-- Hidden by default until selected -->
        <div class="price-details" style="display: none; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #334155; color: #22c55e; font-weight: bold;">
            Price: $500 / Month Setup Included
        </div>
    </div>
</div>

<script>
function toggleServicePrice(cardElement) {
    const priceBox = cardElement.querySelector('.price-details');
    // Toggle reveal state on click selection
    if (priceBox.style.display === 'none') {
        priceBox.style.display = 'block';
    } else {
        priceBox.style.display = 'none';
    }
}
</script>
